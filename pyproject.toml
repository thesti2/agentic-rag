[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thesti2", email = "suwandi.cahyadi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "unstructured>=0.27.37",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[tool.pytest.ini_options]
testpaths = ["graph/chains/tests"]
# Put the project root on sys.path so tests can `import graph.chains...`
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
